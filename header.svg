<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Divyom Srivastava - Robotics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#101C3A"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00E5FF" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="reveal">
      <rect x="60" y="78" height="70" width="0">
        <animate attributeName="width" from="0" to="560" dur="1.8s" begin="0.2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#grid)"/>

  <!-- circuit traces (base) -->
  <g fill="none" stroke="#00E5FF" stroke-opacity="0.18" stroke-width="1.5">
    <path d="M0 40 H90 L120 70 H300 L320 50 H460"/>
    <path d="M0 250 H140 L170 220 H380 L400 240 H560"/>
    <path d="M560 250 H640 L660 262 H700"/>
  </g>
  <!-- circuit traces (data pulses) -->
  <g fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round">
    <path d="M0 40 H90 L120 70 H300 L320 50 H460" pathLength="430" stroke-dasharray="26 404">
      <animate attributeName="stroke-dashoffset" from="430" to="0" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M0 250 H140 L170 220 H380 L400 240 H560" pathLength="430" stroke-dasharray="26 404">
      <animate attributeName="stroke-dashoffset" from="430" to="0" dur="3.8s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- trace nodes -->
  <g fill="#00E5FF">
    <circle cx="460" cy="50" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="240" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="70" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="220" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- status tag -->
  <circle cx="68" cy="30" r="4" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="82" y="34" font-family="'Courier New', Consolas, monospace" font-size="12" letter-spacing="3" fill="#7DE9FF" fill-opacity="0.85">SYSTEM ONLINE</text>

  <!-- name (typed reveal) -->
  <g clip-path="url(#reveal)">
    <text x="60" y="124" font-family="'Courier New', Consolas, monospace" font-size="46" font-weight="700" letter-spacing="2" fill="url(#title)">DIVYOM SRIVASTAVA</text>
  </g>

  <!-- subtitle -->
  <text x="62" y="162" font-family="'Courier New', Consolas, monospace" font-size="16" letter-spacing="4" fill="#BFEFFF" fill-opacity="0">
    ROBOTICS · ROS 2 · PERCEPTION · EMBEDDED
    <animate attributeName="fill-opacity" from="0" to="0.95" dur="0.8s" begin="1.6s" fill="freeze"/>
  </text>

  <!-- status line with blinking cursor -->
  <text x="62" y="200" font-family="'Courier New', Consolas, monospace" font-size="14" letter-spacing="2" fill="#00E5FF" fill-opacity="0">
    &gt; ground | aerial | legged autonomous systems
    <animate attributeName="fill-opacity" from="0" to="0.9" dur="0.8s" begin="2.2s" fill="freeze"/>
  </text>
  <rect x="470" y="188" width="9" height="15" fill="#00E5FF">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.5;1;1" dur="1s" begin="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- propeller (aerial) -->
  <g transform="translate(620 78)">
    <circle r="34" fill="none" stroke="#00E5FF" stroke-opacity="0.2" stroke-dasharray="3 5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
      <ellipse rx="30" ry="4" fill="#00E5FF" fill-opacity="0.55"/>
      <ellipse rx="4" ry="30" fill="#7C3AED" fill-opacity="0.55"/>
    </g>
    <circle r="4" fill="#0B1020" stroke="#00E5FF" stroke-width="1.5"/>
  </g>

  <!-- gear (actuation) -->
  <g transform="translate(620 205)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <circle r="22" fill="none" stroke="#00E5FF" stroke-opacity="0.75" stroke-width="8" stroke-dasharray="8.6 8.6"/>
      <circle r="17" fill="#0B1020" stroke="#00E5FF" stroke-width="2"/>
      <circle r="6" fill="none" stroke="#00E5FF" stroke-width="2"/>
    </g>
  </g>

  <!-- LiDAR radar -->
  <g transform="translate(840 140)">
    <g fill="none" stroke="#00E5FF" stroke-opacity="0.25">
      <circle r="40"/>
      <circle r="80"/>
      <circle r="120"/>
      <line x1="-120" y1="0" x2="120" y2="0"/>
      <line x1="0" y1="-120" x2="0" y2="120"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <path d="M0 0 L120 0 A120 120 0 0 0 98.3 -68.8 Z" fill="#00E5FF" fill-opacity="0.18"/>
      <line x1="0" y1="0" x2="120" y2="0" stroke="#00E5FF" stroke-width="2"/>
    </g>
    <g fill="#22C55E">
      <circle cx="42" cy="-40" r="3.5"><animate attributeName="opacity" values="1;0.1;0.1;1" keyTimes="0;0.5;0.95;1" dur="4s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="-48" cy="38" r="3.5"><animate attributeName="opacity" values="1;0.1;0.1;1" keyTimes="0;0.5;0.95;1" dur="4s" begin="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="78" cy="32" r="3"><animate attributeName="opacity" values="1;0.1;0.1;1" keyTimes="0;0.5;0.95;1" dur="4s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="-20" cy="-84" r="3"><animate attributeName="opacity" values="1;0.1;0.1;1" keyTimes="0;0.5;0.95;1" dur="4s" begin="1.4s" repeatCount="indefinite"/></circle>
    </g>
    <circle r="4" fill="#00E5FF"/>
  </g>
  <text x="840" y="272" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="10" letter-spacing="3" fill="#00E5FF" fill-opacity="0.6">LIDAR · 360° SCAN</text>

  <!-- bottom scan line -->
  <rect x="0" y="276" width="1000" height="2" fill="#00E5FF" fill-opacity="0.12"/>
  <rect x="-200" y="276" width="200" height="2" fill="url(#scan)">
    <animate attributeName="x" from="-200" to="1000" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
